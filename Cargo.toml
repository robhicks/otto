[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/engine-core",
    "crates/workspace",
    "crates/providers",
    "crates/router",
    "crates/tools",
    "crates/agents",
    "crates/engine",
    "crates/persistence",
    "crates/mcp-fs",
    "crates/mcp-grep",
    "crates/mcp-git",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
tempfile = "3"
