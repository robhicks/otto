[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/engine-core",
    "crates/workspace",
    "crates/providers",
    "crates/router",
    "crates/tools",
    "crates/agents",
    "crates/auth",
    "crates/engine",
    "crates/remote",
    "crates/persistence",
    "crates/retrieval",
    "crates/extensions",
    "crates/mcp-fs",
    "crates/mcp-grep",
    "crates/mcp-git",
    "crates/mcp-bash",
    "crates/mcp-lsp",
    "crates/cli",
]
exclude = ["ui-dioxus"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

# Released-binary profile: single codegen unit + LTO + stripped symbols keep the shipped
# `otto` binary lean. Only the release-build path (CI release workflow / users building from
# source) is affected; dev and test builds are untouched.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
tempfile = "3"
