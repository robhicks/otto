[package]
name = "otto-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "otto"
path = "src/main.rs"

[features]
firecracker = ["otto-remote/firecracker"]
candle = ["otto-providers/candle"]
candle-cuda = ["candle", "otto-providers/candle-cuda"]
candle-metal = ["candle", "otto-providers/candle-metal"]

[dependencies]
otto-protocol = { path = "../protocol" }
otto-engine-core = { path = "../engine-core" }
otto-workspace = { path = "../workspace" }
otto-providers = { path = "../providers" }
otto-router = { path = "../router" }
otto-agents = { path = "../agents" }
otto-tools = { path = "../tools" }
otto-persistence = { path = "../persistence" }
otto-remote = { path = "../remote" }
otto-retrieval = { path = "../retrieval" }
otto-extensions = { path = "../extensions" }
dirs = "5"
rmcp = { version = "1.7", features = ["client", "transport-child-process"] }
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "net"] }
async-trait.workspace = true
serde = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
uuid.workspace = true
futures-util = "0.3"

[dev-dependencies]
escargot = "0.5"
# tests/mcp_child_teardown.rs only: `kill(2)` for cleaning up subprocesses that are not this
# process's children (so `std::process::Child::kill` cannot reach them).
libc = "0.2"
tower = { version = "0.5", features = ["util"] }
tempfile.workspace = true
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
rcgen = "0.13"
rustls = "0.23"
# Used only by tests/vps_promote.rs (VpsTarget moved to the otto-remote crate).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
