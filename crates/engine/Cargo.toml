[package]
name = "otto-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "otto"
path = "src/main.rs"

[dependencies]
otto-protocol = { path = "../protocol" }
otto-engine-core = { path = "../engine-core" }
otto-workspace = { path = "../workspace" }
otto-providers = { path = "../providers" }
otto-router = { path = "../router" }
otto-agents = { path = "../agents" }
otto-tools = { path = "../tools" }
otto-persistence = { path = "../persistence" }
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "net"] }
async-trait.workspace = true
serde = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite = "0.24"
futures-util = "0.3"
