[package]
name = "otto-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "otto"
path = "src/main.rs"

[dependencies]
otto-protocol = { path = "../protocol" }
otto-engine-core = { path = "../engine-core" }
otto-workspace = { path = "../workspace" }
otto-providers = { path = "../providers" }
otto-router = { path = "../router" }
otto-agents = { path = "../agents" }
otto-tools = { path = "../tools" }
otto-persistence = { path = "../persistence" }
anyhow.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }

[dev-dependencies]
tempfile.workspace = true
