[package]
name = "otto-remote"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Compiles the real Firecracker microVM provisioner. Off by default: default builds and CI never
# compile hypervisor-specific code. Needs no extra deps (uses std::process + the existing reqwest).
firecracker = ["tokio/time"]

[dependencies]
otto-protocol = { path = "../protocol" }
otto-engine-core = { path = "../engine-core" }
otto-persistence = { path = "../persistence" }
anyhow.workspace = true
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { workspace = true }

# `proc_guard`'s PR_SET_PDEATHSIG guard (prctl/getppid/raise) and its tests' kill(2). Linux-only —
# the guard is a no-op elsewhere, so no other target needs the dependency.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
wiremock = "0.6"
