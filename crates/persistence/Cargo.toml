[package]
name = "otto-persistence"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
otto-protocol = { path = "../protocol" }
async-trait.workspace = true
anyhow.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
# Only `time`, for the bounded connect-retry backoff in `SqliteStore::open`. sqlx's
# `runtime-tokio` feature already puts tokio in the graph, so this declares a dependency that
# was already being built rather than adding one.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
