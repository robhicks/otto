[package]
name = "otto-mcp-lsp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mcp-lsp"
path = "src/main.rs"

[dependencies]
otto-workspace = { path = "../workspace" }
otto-engine-core = { path = "../engine-core" }
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
lsp-types = "0.97"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow.workspace = true
schemars = "1"

[dev-dependencies]
tempfile.workspace = true
