[package]
name = "otto-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
otto-engine-core = { path = "../engine-core" }
async-trait.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "time", "io-util", "rt"] }

# macOS only: `setpgid`/`kill` for the sandbox's process-group sweep. Linux gets the same guarantee
# from `bwrap --unshare-pid`, so it needs no libc here.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
otto-workspace = { path = "../workspace" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }
tempfile.workspace = true
