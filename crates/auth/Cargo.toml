[package]
name = "otto-auth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
otto-protocol = { path = "../protocol" }
otto-engine-core = { path = "../engine-core" }
async-trait.workspace = true
anyhow.workspace = true
serde = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
# Refresh tokens are stored SHA-256-hashed, so a stolen database yields no usable token.
sha2 = "0.10"
# TOTP secrets are stored base32-encoded (RFC 4648, unpadded) — the encoding authenticator
# apps expect — and signing keys / hashes round-trip through hex.
data-encoding = "2"
uuid = { workspace = true }
# Only `time`, for the bounded open-retry backoff in `SqliteAuthStore::open`.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
