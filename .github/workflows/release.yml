# Cut a release by pushing a `v*` tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# This builds a stripped `otto` release binary for six targets (Linux/macOS × x86_64/aarch64, with
# Linux also in a static musl flavor for Alpine and older glibc distros), tars each as
# `otto-<target>.tar.gz` (the cargo-binstall quick-install convention, so `cargo binstall otto`
# works with no extra config), attaches a per-archive `.sha256` checksum (a sidecar named
# `otto-<target>.tar.gz.sha256` — NOT a combined SHA256SUMS file), and drafts a GitHub Release.
# Linux also gets native `.rpm` packages (Fedora/RHEL-family) built from
# `[package.metadata.generate-rpm]` in crates/engine/Cargo.toml. Publish the draft once the
# checksums look right. The same archive layout is what `deploy/install.sh` and
# `deploy/homebrew/otto.rb` expect — keep the three in sync.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        id: create
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Draft so the maintainer can review the asset set before the release goes public.
          draft: true

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # Static musl builds run on Alpine and on older glibc distros whose glibc is newer than
          # the Ubuntu-runner build's (the glibc RPMs need GLIBC_2.39+). The action falls back to
          # `cross` (auto-installed) for these targets.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and upload ${{ matrix.target }}
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: otto
          target: ${{ matrix.target }}
          checksum: sha256
          include: LICENSE-MIT,LICENSE-APACHE
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Fedora/RHEL-family native packages. cargo-generate-rpm needs no rpmbuild or a Fedora host —
  # it packages the cargo-built binary from [package.metadata.generate-rpm] in crates/engine.
  # `recommends: bubblewrap` is encoded in the metadata, so dnf installs the sandbox backend by
  # default. The tool runs from the workspace root (with -p crates/engine) so the metadata's
  # `target/release/otto` asset is relative to the root; the `--target` flag below redirects that
  # to target/<triple>/release/ where the `cargo build --target` above put the binary. RPMs land
  # at target/rpms/otto-<version>-1.<arch>.rpm.
  build-rpm:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: aarch64-unknown-linux-gnu
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p otto-engine
      - name: Build RPM
        run: |
          mkdir -p target/rpms
          cargo generate-rpm -p crates/engine --target ${{ matrix.target }} --output target/rpms
      - name: Upload RPM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rpm=$(find target/rpms -name '*.rpm')
          gh release upload "${{ github.ref_name }}" "$rpm" --clobber
