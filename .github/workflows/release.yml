# Cut a release by pushing a `v*` tag:
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# This builds a stripped `otto` release binary for six targets (Linux/macOS × x86_64/aarch64, with
# Linux also in a static musl flavor for Alpine and older glibc distros), tars each as
# `otto-<target>.tar.gz` (the cargo-binstall quick-install convention — note this alone is NOT
# enough for `cargo binstall`, which also needs the crate published to crates.io under a name
# matching the archive prefix; see the README), attaches a per-archive `.sha256` checksum (a
# sidecar named `otto-<target>.sha256` — the target stem WITHOUT the `.tar.gz` suffix, and NOT a
# combined SHA256SUMS file), and drafts a GitHub Release.
# Linux also gets native `.rpm` packages (Fedora/RHEL-family) built from
# `[package.metadata.generate-rpm]` in crates/engine/Cargo.toml. Publish the draft once the
# checksums look right. The same archive layout is what `deploy/install.sh` and
# `deploy/homebrew/otto.rb` expect — keep the three in sync.
#
# The Homebrew formula is no longer hand-edited: the `bump-homebrew` job below regenerates it from
# this release's own `.sha256` sidecars and commits it to `main`. `deploy/install.sh` resolves the
# tag at runtime and needs no per-release edit, so the archive layout is the only thing left to
# keep in sync by hand.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tag is the only place the release version is declared to the outside world, but it is
      # NOT where the artifacts get their version: the binaries, the RPM file names and the RPM
      # metadata all take theirs from `crates/engine/Cargo.toml`, while the Homebrew formula takes
      # its `version` from the tag. Let the two disagree and the release ships a formula promising
      # one version alongside a binary reporting another — which is exactly what v0.5.0 did, with
      # `otto-0.4.0-1.x86_64.rpm` attached to a v0.5.0 release.
      #
      # `taiki-e/create-gh-release-action` performs this check itself, but only for a manifest at
      # the repository root; ours is a virtual workspace with no `[package]`, so it silently has
      # nothing to compare and the mismatch sails through. Hence the explicit check.
      #
      # It runs before anything is built or published so a mistyped tag costs seconds, not the
      # seven minutes of the six-target matrix. `github.ref_name` reaches the shell through `env:`
      # rather than `${{ }}` interpolation, per the injection note on the bump-homebrew job below.
      - name: Check the tag matches crates/engine/Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          manifest=$(python3 -c \
            'import tomllib,sys; print(tomllib.load(open(sys.argv[1],"rb"))["package"]["version"])' \
            crates/engine/Cargo.toml)
          if [ "$TAG" != "v$manifest" ]; then
            echo "::error::tag $TAG does not match crates/engine/Cargo.toml version $manifest" \
                 "(expected tag v$manifest). Bump the manifest, or re-cut the tag."
            exit 1
          fi
          echo "tag $TAG matches crates/engine/Cargo.toml version $manifest"
      - uses: taiki-e/create-gh-release-action@v1
        id: create
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Draft so the maintainer can review the asset set before the release goes public.
          draft: true

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # Static musl builds run on Alpine and on older glibc distros whose glibc is newer than
          # the Ubuntu-runner build's (the glibc RPMs need GLIBC_2.39+). The action falls back to
          # `cross` (auto-installed) for these targets.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and upload ${{ matrix.target }}
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: otto
          target: ${{ matrix.target }}
          checksum: sha256
          include: LICENSE-MIT,LICENSE-APACHE
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Fedora/RHEL-family native packages. cargo-generate-rpm needs no rpmbuild or a Fedora host —
  # it packages the cargo-built binary from [package.metadata.generate-rpm] in crates/engine.
  # `recommends: bubblewrap` is encoded in the metadata, so dnf installs the sandbox backend by
  # default. The tool runs from the workspace root (with -p crates/engine) so the metadata's
  # `target/release/otto` asset is relative to the root; the `--target` flag below redirects that
  # to target/<triple>/release/ where the `cargo build --target` above put the binary. RPMs land
  # at target/rpms/otto-<version>-1.<arch>.rpm.
  build-rpm:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: aarch64-unknown-linux-gnu
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p otto-engine
      - name: Build RPM
        run: |
          mkdir -p target/rpms
          cargo generate-rpm -p crates/engine --target ${{ matrix.target }} --output target/rpms
      - name: Upload RPM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rpm=$(find target/rpms -name '*.rpm')
          gh release upload "${{ github.ref_name }}" "$rpm" --clobber

  # Point the Homebrew formula at the release we just built, using that release's own `.sha256`
  # sidecars. This was hand-transcription before — four checksums copied by eye, at the one step
  # where a typo silently breaks `brew install` for everyone.
  #
  # The formula is committed to `main`, not to the tag: the documented install command fetches it
  # from raw.githubusercontent.com/robhicks/otto/main/deploy/homebrew/otto.rb, so a formula
  # updated only on the tag would never reach a user.
  #
  # It commits directly rather than opening a PR, deliberately. The formula is a generated file
  # whose content is derived deterministically from published artifacts, so there is nothing for a
  # reviewer or for the Rust CI gate to judge — and a PR opened with GITHUB_TOKEN cannot trigger
  # workflows (GitHub's loop prevention), so a required check would never run on it and it would
  # sit unmergeable.
  #
  # That direct push needs a credential of its own, which is what OTTO_HOMEBREW_TOKEN is. The
  # `main` ruleset requires a pull request and the "fmt + clippy + test" check, and grants bypass
  # only to the Repository admin role. GITHUB_TOKEN runs as github-actions[bot], which holds no
  # role, so with it this job pushes into `remote: error: GH013` and the release fails after every
  # artifact has already been built and uploaded — v0.5.0 did exactly that. Granting the bypass to
  # the GitHub Actions integration instead is not possible here: a bypass actor must be an app
  # installed on the repository, and the API refuses the first-party integration with "Actor GitHub
  # Actions integration must be part of the ruleset source or owner organization". So the push runs
  # as a maintainer PAT, which carries the admin role and therefore the bypass.
  #
  # `needs: upload-assets` waits for every matrix leg, so all four sidecars exist before we read
  # them. The rewrite lives in deploy/update-homebrew-formula.py rather than inline here so it can
  # be exercised locally; it fails without writing unless every substitution lands, because a
  # formula pairing new URLs with stale checksums is worse than one that is a release behind.
  bump-homebrew:
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      # Fail here rather than 30 seconds later at the push. Without the secret, checkout silently
      # falls back to GITHUB_TOKEN and the job dies on an opaque GH013 rule violation that reads
      # like a branch-protection misconfiguration rather than a missing credential.
      - name: Require the Homebrew push token
        env:
          TOKEN: ${{ secrets.OTTO_HOMEBREW_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secret OTTO_HOMEBREW_TOKEN is not set. It must be a PAT belonging to a" \
                 "repository admin with Contents: write, so the push to main clears the ruleset." \
                 "Create it, then: gh secret set OTTO_HOMEBREW_TOKEN"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          # Persisted into the local git credential store, so the `git push` below authenticates as
          # the PAT's owner (an admin, hence past the ruleset) rather than as github-actions[bot].
          token: ${{ secrets.OTTO_HOMEBREW_TOKEN }}
      # `github.ref_name` reaches the shell through `env:` rather than `${{ }}` interpolation
      # throughout this job: a tag name is attacker-shaped input under the usual workflow-injection
      # rules, and a tag containing shell metacharacters would otherwise execute here.
      - name: Download this release's checksum sidecars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/otto-shas
          # Only the four Homebrew targets. The two musl archives are published for Alpine and
          # older-glibc users but are not served by the formula.
          for target in aarch64-apple-darwin x86_64-apple-darwin \
                        aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            gh release download "$TAG" \
              --repo "$REPO" \
              --pattern "otto-${target}.sha256" \
              --dir /tmp/otto-shas
          done
      - name: Rewrite the formula
        env:
          TAG: ${{ github.ref_name }}
        run: python3 deploy/update-homebrew-formula.py "$TAG" /tmp/otto-shas
      - name: Commit to main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- deploy/homebrew/otto.rb; then
            echo "formula already describes $TAG; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/homebrew/otto.rb
          git commit -m "release: point the Homebrew formula at $TAG"
          # main may have moved while the six targets built; rebase rather than fail the release.
          git pull --rebase origin main
          git push origin HEAD:main
