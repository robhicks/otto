[workspace]

[package]
name = "otto-ui-dioxus"
version = "0.1.0"
edition = "2021"

[features]
default = []
web = ["dioxus/web", "dep:web-sys", "dep:gloo-net", "dep:wasm-bindgen", "dep:getrandom", "uuid/js"]
desktop = [
    "dioxus/desktop",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:reqwest",
    "dep:rfd",
    "dep:libc",
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
]

[dependencies]
dioxus = "0.7"
otto-protocol = { path = "../crates/protocol" }
serde_json = "1"
urlencoding = "2.1"
# uuid's `js` feature (getrandom via wasm) is wasm-only — enabled only under the
# `web` feature above so it never applies to the native `desktop` build.
uuid = { version = "1", features = ["v4"] }
# Delivers inbound SocketEvents to the reactivity spine on both targets (transport/mod.rs).
# Non-optional: both `web` and `desktop` transport impls depend on it.
futures-channel = "0.3"
# `StreamExt` (the drain loop's `.next()`) is used by app.rs on both targets — non-optional
# (previously desktop-only, promoted here since the reactivity spine needs it unconditionally).
futures-util = "0.3"

# web transport (only compiled with --features web)
wasm-bindgen = { version = "0.2", optional = true }
gloo-net = { version = "0.6", features = ["http", "websocket"], optional = true }
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "History",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
], optional = true }

# desktop transport (only compiled with --features desktop)
# `process`/`io-util`/`time` are used by `desktop_boot`: spawn the `otto serve` sidecar with piped
# stderr (`process`), async-read its readiness line via `BufReader::lines` (`io-util`), and bound
# the readiness wait with `tokio::time::timeout` (`time`).
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "process",
    "io-util",
    "time",
], optional = true }
tokio-tungstenite = { version = "0.24", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
rfd = { version = "0.15", optional = true }
# Sidecar teardown guard (`PR_SET_PDEATHSIG`): used in `desktop_boot::install_pdeathsig`'s
# `pre_exec` so the kernel kills the `otto serve` sidecar when this process dies for ANY reason —
# including the non-unwinding teardowns (SIGKILL/`exit`) that `kill_on_drop` cannot catch. See the
# Phase 0 Gate-E finding (`docs/superpowers/spikes/2026-07-21-ui-runtime/results/dioxus-desktop.md`).
# Also used by that module's regression tests (`kill`, `open`, `nanosleep`, `getppid`, …).
libc = { version = "0.2", optional = true }

# desktop-native syntax highlighting (only compiled with --features desktop). The web build cannot
# share these — tree-sitter's grammars are C built through cc-rs and wasm32-unknown-unknown has no
# libc — so it highlights the same five languages with a dependency-free lexer instead
# (src/editor/highlight_web.rs). Versions match crates/retrieval/Cargo.toml so the grammar set
# stays consistent across the workspace.
tree-sitter = { version = "0.26.9", optional = true }
tree-sitter-highlight = { version = "0.26.10", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }

[dev-dependencies]
dioxus-ssr = "0.7"
# `resolve_otto_bin_in`'s tests (desktop_boot.rs) stage a fake sidecar file in a scratch dir.
tempfile = "3"

# Browser-only test harness for `src/web_mount_test.rs`. Target-gated to wasm32 (NOT just
# feature-gated) so the native `--features desktop` build never resolves or compiles these —
# `cargo test --features desktop` on the host is unaffected. Must stay AFTER the plain
# `[dev-dependencies]` table above: everything following this header belongs to it.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
# `TimeoutFuture` bounds the VirtualDom drive loop so a regression fails the test instead of
# hanging the browser runner forever.
gloo-timers = { version = "0.3", features = ["futures"] }

# --- wasm-opt crash fix (Phase 1, item 1) ---------------------------------------------------
# Release web builds compile under the Dioxus CLI's own `wasm-release` cargo profile (see
# `target/wasm32-unknown-unknown/wasm-release/`). The wasm that profile produced carried ~1.24 MB
# of DWARF-4 debug sections, and dx then invoked wasm-opt as:
#
#   wasm-opt <in> -Oz -o <out> --enable-reference-types --enable-bulk-memory \
#            --enable-mutable-globals --enable-nontrapping-float-to-int --enable-threads --debuginfo
#
# `--debuginfo` makes binaryen parse that DWARF so it can rewrite it, and dx's bundled binaryen
# (reports "version 127") aborts on it:
#
#   compile unit size was incorrect (this may be an unsupported version of DWARF)
#   -> wasm-opt failed with status code signal: 6 (SIGABRT)
#
# dx logs that and still exits 0, copying the UNOPTIMIZED wasm straight through — a silent
# failure, which is why the release bundle was 2.16 MB instead of 795 KB.
#
# `strip = "debuginfo"` is the line that fixes it: the DWARF is dropped before wasm-opt ever sees
# it. `debug = false` does NOT work here and is deliberately absent — this profile already
# resolves to `debug = false` via `inherits = "release"`, and the DWARF appears anyway, so
# something other than the profile's debuginfo setting is emitting it (dx runs cargo with a
# RUSTC_WORKSPACE_WRAPPER and leaves artifacts in `target/dx/.captured-args/`, but the exact
# source was not pinned down — treat that as the open question, not as established). What IS
# established, by A/B build: with `debug = false` and no `strip`, wasm-opt still aborts; with
# `strip` and no `debug`, it runs clean.
#
# `opt-level = "s"` restores a dx default rather than choosing a new one. dx synthesizes
# `profile.wasm-release.{inherits,opt-level}` on the cargo command line ONLY when this manifest
# does not define the profile; defining it here suppresses that, which would silently drop the
# build to `release`'s `opt-level = 3` and cost ~92 KB (887,715 vs 795,188 bytes of wasm).
# (Captured from the real cargo invocation, not inferred.)
#
# One caveat worth knowing: dx still passes `--config profile.wasm-release.strip=false` on every
# build, and cargo documents config-level profile settings as outranking manifest ones — yet the
# manifest `strip` is demonstrably what the build ends up using. That is an observation, not an
# explanation; do not read a general cargo precedence rule out of it. If a dx upgrade ever makes
# its `--config` win, guards 2-4 in scripts/measure-web-bundle.sh are what will catch it.
#
# Scope: `wasm-release` is reachable only via `--profile wasm-release`, i.e. release web builds
# (`dx build/serve/bundle --release --platform web`). `cargo test`, `cargo build --target
# wasm32-unknown-unknown`, and dev `dx serve` use dev/release and are unaffected — dev hot-reload
# keeps its debug info. This block also depends on `ui-dioxus/` being its own workspace root (the
# `[workspace]` table at the top of this file): cargo honors `[profile.*]` only in a workspace
# ROOT manifest, so folding this crate into the top-level workspace would silently make the
# profile inert and bring the SIGABRT back.
#
# Measure with `./scripts/measure-web-bundle.sh`, which fails rather than report an untrustworthy
# figure if wasm-opt regresses.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
