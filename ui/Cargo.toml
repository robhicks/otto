[workspace]

[package]
name = "otto-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
kode-leptos = "=0.5.4"
gloo-net = { version = "0.6", features = ["http"] }
otto-protocol = { path = "../crates/protocol" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "Node",
    "Element",
    "HtmlElement",
    "HtmlDivElement",
] }
serde_json = "1"
urlencoding = "2.1"
uuid = { version = "1", features = ["js"] }
console_error_panic_hook = "0.1"
# uuid pulls getrandom (v4); on wasm32-unknown-unknown getrandom needs an explicit
# browser backend even though the UI never generates randomness — enable it here and
# via .cargo/config.toml.
getrandom = { version = "0.4", features = ["wasm_js"] }
